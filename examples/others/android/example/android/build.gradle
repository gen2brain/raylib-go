apply plugin: 'com.android.application'

android {
    namespace = "com.example.android"
    compileSdk = 36

    defaultConfig {
        applicationId "com.example.android"
        minSdk = 24
        targetSdk = 36
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
